# GitHub Copilot app configuration for this project.
#
# A plugin has nothing to run on its own: the section, the routes and the MCP
# server only come alive inside a Precursor that discovered them through the
# `precursor.plugins` entry point. So a session here provisions two things —
# this checkout, and a host to load it into — and the run script boots that
# host with the plugin already installed.
#
# The app asks you to review and accept this file before it applies any of it.
# Reference:
# https://docs.github.com/copilot/reference/github-copilot-app-reference/repository-configuration

instructions: |
  This repository is a Precursor *plugin*, not an application. Nothing here runs
  standalone — the host loads it through the `precursor.plugins` entry point.

  Run `uv` with `--frozen` (or `UV_FROZEN=1`). A plain `uv run` re-resolves
  through a package proxy and rewrites `uv.lock`, which fails
  `tests/test_check_lockfiles.py`. Never run `uv lock` locally — lockfiles are
  regenerated by the Relock workflow.

  The frontend is a build product: `src/precursor_kanban/web/` is gitignored and
  generated by `make build`. Without it the backend still advertises the section
  and the app has nothing to import, so the section silently doesn't appear.
  Rebuild it after any change under `web/src/`.

  `.precursor-host/` is a throwaway checkout of the host, managed by
  `scripts/dev-host.sh`. Never edit or commit anything in it; fix the host
  upstream instead.

scripts:
  # Provisions the plugin environment *and* a host checkout to run it in, then
  # installs this working tree into the host, editable. Takes a few minutes the
  # first time — mostly npm and the host's own dependencies.
  - name: Setup env
    command: ./scripts/dev-host.sh setup
    triggers:
      - session.create

  # The host's dev stack (uvicorn --reload + Vite HMR) with this plugin loaded.
  # `--port 0` inside the script means the OS picks a free port, so several
  # sessions can run their own board side by side without colliding.
  - name: Dev Server
    command: ./scripts/dev-host.sh run

  # Rebuild the bundle the host serves at /api/plugins/kanban/assets/*. The
  # editable install means this is all a frontend change needs — no reinstall.
  - name: Rebuild plugin bundle
    command: make build

  - name: Checks
    command: make check

  # The host checkout and both node_modules trees are large and disposable.
  - name: Archive cleanup
    command: rm -rf .precursor-host web/node_modules
    triggers:
      - session.archive

# The host prints `▶ Open   http://127.0.0.1:<port>/` once the stack is up. With
# `--port 0` that port is only known at runtime, so it is read from the banner
# rather than configured here. The banner is bold, so the capture stops at ESC
# as well as at whitespace — otherwise the reset sequence lands in the URL.
server_ready_pattern: '(?i)▶ Open\s+(https?://[^\s\x1B]+|[0-9]+)'
auto_open_in_browser: true

automation:
  auto_issue_session: true
  remote_control: false
